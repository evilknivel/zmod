# pro_extras – Erweiterungen für FlashForge Adventurer 5M Pro mit Z-Mod
# https://github.com/evilknivel/zmod-pro-extras
#
# Befehle (Fluidd-Konsole):
#   PRO_EXTRAS_STATUS          aktuelle Einstellungen und Sensorwerte
#   PRO_EXTRAS_SET ...         Einstellungen ändern (siehe README)
#   PRO_EXTRAS_SETUP           Grundeinrichtung erneut ausführen
#   PRO_EXTRAS_KLIPPER13       Dialog zum Umstieg auf Klipper 13

[gcode_shell_command pro_extras_harden]
command: /opt/config/mod_data/plugins/pro_extras/harden.sh
timeout: 60
verbose: True

# Thermistor auf dem Extruder-Board. Unter Klipper 13 definiert Z-Mod ihn
# bereits – Klipper führt gleichnamige Sektionen zusammen.
# Bewusst ohne min_temp/max_temp: ein Anzeige-Sensor soll keinen Shutdown auslösen.
[temperature_sensor head]
sensor_type: Generic 3950
sensor_pin: eboard:PA1

# Version der Grundeinrichtung. Erhöhen, wenn sich die Defaults ändern –
# dann wird die Einrichtung nach dem Update einmal erneut ausgeführt.
[gcode_macro _PE_VERSION]
variable_setup: 1
gcode:

##############################################################################
# Grundeinrichtung (läuft automatisch nach dem Start)
##############################################################################

[delayed_gcode _PE_AUTOSETUP]
initial_duration: 30
gcode:
    _PE_AUTOSETUP_RUN

[gcode_macro _PE_AUTOSETUP_RUN]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set version = printer["gcode_macro _PE_VERSION"].setup|int %}
    {% set state = printer.print_stats.state %}

    {% if state in ["printing", "paused"] %}
        # Nie während eines Drucks eingreifen – später erneut versuchen
        UPDATE_DELAYED_GCODE ID=_PE_AUTOSETUP DURATION=300
    {% elif sv.pe_reboot|default(0)|int == 1 %}
        SAVE_VARIABLE VARIABLE=pe_reboot VALUE=0
        RESPOND TYPE=echo MSG="pro_extras: Neustart, damit alle Einstellungen aktiv werden ..."
        REBOOT
    {% elif sv.pe_setup|default(0)|int < version %}
        _PE_SETUP_APPLY
    {% elif sv.klipper13|default(0)|int == 0 and sv.pe_k13_ask|default(1)|int == 1 %}
        RESPOND TYPE=echo MSG="pro_extras: Klipper 13 ist noch nicht aktiv. Umstieg mit PRO_EXTRAS_KLIPPER13"
        _PE_K13_PROMPT
    {% endif %}

[gcode_macro _PE_SETUP_APPLY]
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set version = printer["gcode_macro _PE_VERSION"].setup|int %}
    {% set lan = sv.pe_lan|default("192.168.1.0/24")|string %}

    RESPOND TYPE=echo MSG="pro_extras: Grundeinrichtung v{version} ..."

    # Empfohlene Z-Mod-Einstellungen + China-Cloud blockieren
    SAVE_ZMOD_DATA CHINA_CLOUD=0 CLOSE_DIALOGS=2 PRINT_LEVELING=1 USE_KAMP=1 CLEAR=LINE_PURGE

    # zmod.link-Tunnel (Server in Moskau) abschalten
    ZLINK_OFF

    # Moonraker auf das Heimnetz beschränken, zmod.link-CORS entfernen
    RUN_SHELL_COMMAND CMD=pro_extras_harden PARAMS="{lan}"

    SAVE_VARIABLE VARIABLE=pe_setup VALUE={version}
    SAVE_VARIABLE VARIABLE=pe_reboot VALUE=1

    # Zum Schluss: offizielles recommend-Plugin des Autors (löst selbst einen
    # Klipper-Neustart aus, danach folgt automatisch ein Reboot)
    RESPOND TYPE=echo MSG="pro_extras: aktiviere Plugin recommend ..."
    # Fallback: falls recommend nicht neu startet (z. B. kein Internet),
    # übernimmt der Autosetup in 2 min den Reboot
    UPDATE_DELAYED_GCODE ID=_PE_AUTOSETUP DURATION=120
    ENABLE_PLUGIN NAME=recommend

[gcode_macro PRO_EXTRAS_SETUP]
description: pro_extras – Grundeinrichtung erneut ausführen
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="pro_extras: nicht während eines Drucks"
    {% else %}
        _PE_SETUP_APPLY
    {% endif %}

##############################################################################
# Klipper 13
##############################################################################

[gcode_macro PRO_EXTRAS_KLIPPER13]
description: pro_extras – Umstieg auf Klipper 13 (Dialog)
gcode:
    _PE_K13_PROMPT

[gcode_macro _PE_K13_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Klipper 13 aktivieren?"
    RESPOND TYPE=command MSG="action:prompt_text Flasht die Firmware von Mainboard und Extruder-Board (UPDATE_MCU FORCE=13)."
    RESPOND TYPE=command MSG="action:prompt_text Ablauf: Melodie abwarten, Drucker AUSSCHALTEN, 10 s warten, wieder EINSCHALTEN."
    RESPOND TYPE=command MSG="action:prompt_text Wichtig: Vor jedem Stock-Firmware-Update oder Entfernen von Z-Mod erst UPDATE_MCU ausführen!"
    RESPOND TYPE=command MSG="action:prompt_footer_button Nie fragen|_PE_K13 ANSWER=never"
    RESPOND TYPE=command MSG="action:prompt_footer_button Später|_PE_K13 ANSWER=later"
    RESPOND TYPE=command MSG="action:prompt_footer_button Jetzt flashen|_PE_K13 ANSWER=yes|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PE_K13]
gcode:
    {% set answer = params.ANSWER|default("later")|lower %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if answer == "yes" %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            RESPOND TYPE=error MSG="pro_extras: nicht während eines Drucks"
        {% else %}
            UPDATE_MCU FORCE=13
        {% endif %}
    {% elif answer == "never" %}
        SAVE_VARIABLE VARIABLE=pe_k13_ask VALUE=0
        RESPOND TYPE=echo MSG="pro_extras: Frage abgeschaltet. Später manuell: PRO_EXTRAS_KLIPPER13"
    {% endif %}

##############################################################################
# Überwachung: Druckkopf-Temperatur und Luftfilter
##############################################################################

[delayed_gcode _PE_LOOP]
initial_duration: 20
gcode:
    _PE_TICK
    UPDATE_DELAYED_GCODE ID=_PE_LOOP DURATION=10

[gcode_macro _PE_TICK]
variable_was_printing: False
variable_warned: False
variable_paused: False
variable_air_set: False
variable_air_mode: ""
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set me = printer["gcode_macro _PE_TICK"] %}
    {% set state = printer.print_stats.state %}
    {% set printing = state == "printing" %}
    {% set ended = me.was_printing and state in ["complete", "cancelled", "error", "standby"] %}
    {% set new_print = printing and not me.was_printing %}

    {% set warned = me.warned and not new_print %}
    {% set paused = me.paused and not new_print %}
    {% set air_set = me.air_set and not new_print %}

    {% set head_warn = sv.pe_head_warn|default(60)|float %}
    {% set head_pause = sv.pe_head_pause|default(75)|float %}
    {% set air_on = sv.pe_air|default(1)|int == 1 %}
    {% set hot_bed = sv.pe_air_hot_bed|default(90)|float %}
    {% set hot_mode = sv.pe_air_hot_mode|default("INTERNAL")|string|upper %}
    {% set cold_mode = sv.pe_air_cold_mode|default("EXTERNAL")|string|upper %}
    {% set runon = sv.pe_air_runon|default(10)|int %}
    {% set tvoc_limit = sv.pe_tvoc_limit|default(0)|float %}
    {% set has_air = 'gcode_macro AIR_CIRCULATION_INTERNAL' in printer %}

    # --- Status-Flags fortschreiben ---
    {% if new_print %}
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=was_printing VALUE=True
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=warned VALUE=False
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=paused VALUE=False
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=air_set VALUE=False
        UPDATE_DELAYED_GCODE ID=_PE_AIR_STOP DURATION=0
    {% elif ended %}
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=was_printing VALUE=False
    {% endif %}

    # --- Druckkopf-Temperatur ---
    {% if printing and 'temperature_sensor head' in printer %}
        {% set t = printer['temperature_sensor head'].temperature|float %}
        {% if head_pause > 0 and t >= head_pause and not paused %}
            RESPOND TYPE=error MSG="pro_extras: Druckkopf {'%.1f' % t} °C >= {head_pause} °C – Druck pausiert! Lüfter/Heatbreak prüfen."
            SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=paused VALUE=True
            SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=warned VALUE=True
            PAUSE
        {% elif head_warn > 0 and t >= head_warn and not warned %}
            RESPOND TYPE=error MSG="pro_extras: Warnung – Druckkopf {'%.1f' % t} °C (Grenze {head_warn} °C)"
            SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=warned VALUE=True
        {% endif %}
    {% endif %}

    # --- Luftfilter: Modus beim Druckstart nach Betttemperatur wählen ---
    {% if has_air and air_on and printing and not air_set %}
        {% set bed = printer.heater_bed.target|float %}
        {% if bed > 0 %}
            {% set mode = hot_mode if bed >= hot_bed else cold_mode %}
            _PE_AIR MODE={mode}
            SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=air_set VALUE=True
            SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=air_mode VALUE='"{mode}"'
        {% endif %}
    {% endif %}

    # --- Luftfilter: Nachlauf nach Druckende ---
    {% if has_air and air_on and ended and me.air_mode not in ["", "OFF"] %}
        {% if runon > 0 %}
            RESPOND TYPE=echo MSG="pro_extras: Luftfilter läuft noch {runon} min nach"
            UPDATE_DELAYED_GCODE ID=_PE_AIR_STOP DURATION={runon * 60}
        {% else %}
            _PE_AIR MODE=OFF
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=air_mode VALUE='""'
    {% endif %}

    # --- Optional: TVOC-Schwelle im Leerlauf (nur Stock-Klipper 11) ---
    {% if has_air and tvoc_limit > 0 and not printing and state != "paused" and me.air_mode == "" and 'temperature_sensor tvocValue' in printer %}
        {% if printer['temperature_sensor tvocValue'].temperature|float >= tvoc_limit %}
            RESPOND TYPE=echo MSG="pro_extras: TVOC über {tvoc_limit} – Filter läuft {[runon, 5]|max} min"
            _PE_AIR MODE=INTERNAL
            SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=air_mode VALUE='"TVOC"'
            UPDATE_DELAYED_GCODE ID=_PE_AIR_STOP DURATION={[runon, 5]|max * 60}
        {% endif %}
    {% endif %}

[gcode_macro _PE_AIR]
gcode:
    {% set mode = params.MODE|default("OFF")|string|upper %}
    {% if mode == "INTERNAL" %}
        AIR_CIRCULATION_INTERNAL
    {% elif mode == "EXTERNAL" %}
        AIR_CIRCULATION_EXTERNAL
    {% else %}
        AIR_CIRCULATION_STOP
    {% endif %}

[delayed_gcode _PE_AIR_STOP]
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        _PE_AIR MODE=OFF
        SET_GCODE_VARIABLE MACRO=_PE_TICK VARIABLE=air_mode VALUE='""'
    {% endif %}

##############################################################################
# Einstellungen
##############################################################################

[gcode_macro PRO_EXTRAS_SET]
description: pro_extras – Einstellungen ändern
gcode:
    {% if params.HEAD_WARN is defined %}
        SAVE_VARIABLE VARIABLE=pe_head_warn VALUE={params.HEAD_WARN|float}
    {% endif %}
    {% if params.HEAD_PAUSE is defined %}
        SAVE_VARIABLE VARIABLE=pe_head_pause VALUE={params.HEAD_PAUSE|float}
    {% endif %}
    {% if params.AIR is defined %}
        SAVE_VARIABLE VARIABLE=pe_air VALUE={params.AIR|int}
    {% endif %}
    {% if params.AIR_HOT_BED is defined %}
        SAVE_VARIABLE VARIABLE=pe_air_hot_bed VALUE={params.AIR_HOT_BED|float}
    {% endif %}
    {% for key in ["AIR_HOT_MODE", "AIR_COLD_MODE"] %}
        {% if params[key] is defined %}
            {% set v = params[key]|string|upper %}
            {% if v in ["INTERNAL", "EXTERNAL", "OFF"] %}
                SAVE_VARIABLE VARIABLE=pe_{key|lower} VALUE='"{v}"'
            {% else %}
                RESPOND TYPE=error MSG="pro_extras: {key} muss INTERNAL, EXTERNAL oder OFF sein"
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if params.AIR_RUNON is defined %}
        SAVE_VARIABLE VARIABLE=pe_air_runon VALUE={params.AIR_RUNON|int}
    {% endif %}
    {% if params.TVOC_LIMIT is defined %}
        SAVE_VARIABLE VARIABLE=pe_tvoc_limit VALUE={params.TVOC_LIMIT|float}
    {% endif %}
    {% if params.K13_ASK is defined %}
        SAVE_VARIABLE VARIABLE=pe_k13_ask VALUE={params.K13_ASK|int}
    {% endif %}
    {% if params.LAN is defined %}
        SAVE_VARIABLE VARIABLE=pe_lan VALUE='"{params.LAN}"'
        RUN_SHELL_COMMAND CMD=pro_extras_harden PARAMS="{params.LAN}"
        RESPOND TYPE=echo MSG="pro_extras: Netz geändert – wirksam nach REBOOT"
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_PE_SHOW DURATION=1

[delayed_gcode _PE_SHOW]
gcode:
    PRO_EXTRAS_STATUS

[gcode_macro PRO_EXTRAS_STATUS]
description: pro_extras – Status anzeigen
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set lines = [] %}
    {% set _ = lines.append("Setup-Version: %s / Klipper 13: %s" % (sv.pe_setup|default(0), "ja" if sv.klipper13|default(0)|int == 1 else "nein")) %}
    {% set _ = lines.append("Heimnetz (LAN): %s" % sv.pe_lan|default("192.168.1.0/24")) %}
    {% if 'temperature_sensor head' in printer %}
        {% set _ = lines.append("Druckkopf: %.1f °C" % printer['temperature_sensor head'].temperature) %}
    {% endif %}
    {% if 'temperature_sensor tvocValue' in printer %}
        {% set _ = lines.append("TVOC: %.1f" % printer['temperature_sensor tvocValue'].temperature) %}
    {% endif %}
    {% set _ = lines.append("HEAD_WARN=%s HEAD_PAUSE=%s" % (sv.pe_head_warn|default(60), sv.pe_head_pause|default(75))) %}
    {% set _ = lines.append("AIR=%s AIR_HOT_BED=%s AIR_HOT_MODE=%s AIR_COLD_MODE=%s AIR_RUNON=%s TVOC_LIMIT=%s" % (sv.pe_air|default(1), sv.pe_air_hot_bed|default(90), sv.pe_air_hot_mode|default("INTERNAL"), sv.pe_air_cold_mode|default("EXTERNAL"), sv.pe_air_runon|default(10), sv.pe_tvoc_limit|default(0))) %}
    RESPOND TYPE=echo MSG="pro_extras: {lines|join(' | ')}"
