# Temperatursensor auf dem Extruder-Board (eboard) in Fluidd/Mainsail anzeigen
#
# Gilt für: Adventurer 5M / 5M Pro / AD5X  (NICHT für Creator 5 Pro – dort ist
# eboard:PA1 der Motorstrom-Sensor!)
#
# Einbau: Inhalt dieser Datei ans Ende von  mod_data/user.cfg  kopieren
# (Fluidd -> Configuration -> mod_data -> user.cfg), speichern, FIRMWARE_RESTART.
#
# Hintergrund: Z-Mod definiert diesen Sensor nur, wenn Klipper 13 aktiv ist
# (mod/klipper13_base.cfg). Mit dem Stock-Klipper 11 auf dem AD5M fehlt er.
# Klipper führt gleichnamige Sektionen zusammen – doppelt definieren ist also
# unkritisch, falls er schon vorhanden ist.

[temperature_sensor head]
sensor_type: Generic 3950
sensor_pin: eboard:PA1
# bewusst kein min_temp/max_temp: ein reiner Anzeige-Sensor soll bei
# Ausreißern keinen Klipper-Shutdown auslösen (identisch zu Z-Mod)

# Optional: interne Chip-Temperatur des Extruder-Board-MCU.
# Auskommentieren entfernen, falls gewünscht. Falls Klipper danach mit einem
# Fehler zu "temperature_mcu" nicht startet, unterstützt die MCU-Firmware das
# nicht – dann wieder auskommentieren.
#[temperature_sensor eboard_mcu]
#sensor_type: temperature_mcu
#sensor_mcu: eboard
